server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth; add_header in a child location will
    # suppress inheritance, but the SPA document served by "location /" below
    # has no own add_header and therefore inherits these server-level ones.)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP starts as Report-Only: browser logs violations without blocking. To
    # enforce, rename to Content-Security-Policy. style-src needs 'unsafe-inline'
    # for Element Plus/Vue runtime-injected styles; img/connect allow https: and
    # ws/wss: for cloud-storage presigned URLs (OSS/S3/MinIO) and WebSocket push.
    # Violations during the observation window POST to /api/v1/csp-report (same /api/
    # proxy prefix as normal API calls) and are written to backend logs.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; form-action 'self'; report-uri /api/v1/csp-report" always;

    # Avoid duplicate security headers on proxied API responses: the Go backend's
    # SecurityHeaders middleware also sets X-Frame-Options / X-Content-Type-Options /
    # Referrer-Policy, and nginx re-adds its own (server-level add_header above) when
    # proxying, so hide the upstream (Go) copies to keep exactly one of each. nginx is
    # the single source for client-facing responses; Go's headers still apply when the
    # backend is reached directly (e.g. Vite dev proxy bypassing nginx).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://api:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running API requests
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # WebSocket proxy (for real-time alerts, announcements)
    location /api/v1/ws {
        proxy_pass http://api:8081/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}