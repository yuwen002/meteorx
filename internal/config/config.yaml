server:
  port: 8081
  mode: debug
  # 调试后门开关：允许固定 Token "123456789" 免登录超级管理员。
  # 仅当 mode != release 且此处为 true 时生效，生产环境必须保持 false
  test_bypass: false
  # 可信反向代理 CIDR 列表：解析客户端真实 IP 时右起跳过这些段，取首个不可信地址（防 XFF 伪造）。
  # 多跳部署（如 CDN → nginx → 本服务）必须配置，否则记到的是最后一层代理的 IP；
  # 单跳 nginx 反代部署可留空（回落取 XFF 最右一条，nginx 追加的对端即真实客户端）。
  # 示例（Docker 内网 + 本机回环）：
  # trusted_proxies:
  #   - "172.16.0.0/12"
  #   - "127.0.0.1/32"

database:
  driver: mysql      # 建议加上驱动，方便以后扩展 pgsql
  host: 127.0.0.1    # 建议用 IP，有时 localhost 在 Docker 容器内会有指向问题
  port: 3306
  user: root
  password: 123456
  name: meteorx
  tls: false         # 修正：去掉引号
  debug: true        # 开启后在控制台输出 SQL 日志
  slow_query_ms: 500 # 慢查询判定阈值（毫秒）：执行耗时超过该值的 SQL 采集到慢查询看板；0 回落默认 500，负值关闭采集
  timezone: Asia/Shanghai  # 业务时区：启动时强制 time.Local，使时间语义与容器 TZ 解耦；留空默认 Asia/Shanghai
  # 读写分离配置（如不需从库，留空即可）
  # replicas:
  #   - host: 192.168.1.101
  #     port: 3306
  #     user: replicator
  #     password: readonly_pass
  #     name: meteorx
  #     tls: false
  #     weight: 2        # 权重越高分配到的查询越多（默认 1）
  #   - host: 192.168.1.102
  #     port: 3306
  #     user: replicator
  #     password: readonly_pass
  #     name: meteorx
  #     tls: false
  #     weight: 1

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

jwt:
  # ⚠️ 生产环境务必使用强随机密钥（至少32位）
  # 生成方式: openssl rand -base64 64
  secret: "CHANGE-THIS-TO-A-STRONG-RANDOM-SECRET-KEY-IN-PRODUCTION"
  expiration: 24h    # 对应 Go 的 time.Duration

log:
  level: info
  format: json       # 生产环境选 json，开发环境可以改为 text

security:
  login_lockout:
    enabled: true
    max_attempts: 5           # 最多允许 5 次失败
    lockout_duration: 30m     # 锁定 30 分钟
    reset_after: 24h          # 24 小时后重置计数
  password_policy:
    enabled: true
    min_length: 8             # 最少 8 位
    max_length: 32            # 最多 32 位
    require_uppercase: true   # 需要大写字母
    require_lowercase: true   # 需要小写字母
    require_digit: true       # 需要数字
    require_special: true     # 需要特殊字符
  rate_limit:
    enabled: true
    requests: 100             # 每个窗口最多 100 请求
    window: 1m                # 1 分钟窗口
    burst_size: 10            # 突发请求 10 个

file:
  upload_path: "./uploads"   # 文件上传存储路径
  # 文件访问URL前缀：接口返回的 url 会附带短时效 HMAC 签名（默认 30 分钟），
  # 由 file.sign_key 派生签名密钥（独立于 jwt.secret，未配置时回退 jwt.secret 兼容旧部署）；
  # /uploads 静态服务会校验签名后才提供文件
  upload_url: "http://localhost:8081/uploads"
  # 独立签名密钥（建议至少 32 位随机串）：只影响上传访问链接，轮换不会使登录态失效。
  # 支持平滑轮换：逗号分隔传入新旧密钥，第一把用于签发新链接，其余仅校验存量链接，
  # 待旧链接全部过期后移除旧密钥即可，例如 "new-key,old-key"。
  # 生成方式: openssl rand -base64 32
  # sign_key: ""
  max_file_size: 10485760    # 最大文件大小 10MB (10 * 1024 * 1024)
  allowed_types:             # 允许的文件类型
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.ms-excel"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "text/plain"

  # 存储后端类型：local（默认，本地磁盘）/ oss（阿里云 OSS）/ s3（AWS S3 及 S3 兼容端点如 MinIO）
  # storage_type: "local"
  # 云存储配置（仅 storage_type 为 oss / s3 时生效，可经环境变量覆盖，详见 .env.example）
  # 初始化失败（如缺少必填项）时会自动降级为本地存储并打印告警，不阻断启动
  # cloud:
  #   endpoint: ""            # OSS: oss-cn-hangzhou.aliyuncs.com；S3: 留空走 AWS，填写则适配 MinIO 等
  #   region: ""              # S3 必填（如 us-east-1）；OSS 可留空
  #   bucket: ""              # 存储桶名称
  #   access_key: ""          # AccessKey / AccessKeyID
  #   secret_key: ""          # SecretKey / AccessKeySecret
  #   path_prefix: ""         # 对象键前缀（可选），如 "prod/files"
  #   public_base_url: ""     # 公开/CDN 访问基址（可选）；配置后返回公开直链，否则返回预签名 URL
  #   presign_ttl: 3600       # 私有桶预签名 URL 有效期（秒），默认 3600
  #   force_path_style: false # S3 连接 MinIO 等自建端点时通常需置 true

email:
  enabled: false
  host: "smtp.example.com"
  port: 587
  username: "noreply@example.com"
  password: "your-email-password"
  from: "noreply@example.com"
  from_name: "MeteorX 平台"

client:
  base_url: "http://localhost:5173"
  # allowed_origins:           # 可选：额外的 CORS 跨域来源白名单（含协议与端口，用于多前端场景）
  #   - "http://localhost:5173"

# IP 地理位置解析配置
ip_location:
  provider: "http-api"  # 解析方式：http-api（在线）/ ip2region（离线）
  db_path: "./data/ip2region.xdb"  # ip2region 数据库文件路径（仅 provider=ip2region 时需要）
  timeout: 3  # HTTP API 超时时间（秒），默认 3

# OAuth2 第三方登录配置
oauth:
  refresh_token_ttl: 168h    # 刷新令牌有效期，默认 168h（7 天）；改短可增强安全性
  state_ttl: 10m             # CSRF state 有效期，默认 10m；一般无需修改
  # OAuth 凭据加密主密钥（base64 编码的 32 字节随机值）。
  # 后台「第三方登录管理」保存的 client_secret 以此密钥 AES-256-GCM 加密后落库。
  # 生成：openssl rand -base64 32
  # 留空时后台保存含 client_secret 的配置会被拒绝（HTTP 422），不会以明文落库。
  secret_key: ""
  google:
    enabled: false
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:5173/auth/google/callback"
  github:
    enabled: false
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:5173/auth/github/callback"
  # 国内主流第三方登录（默认均关闭，按需开启并填写对应开放平台凭证）
  wechat:
    enabled: false
    client_id: ""        # 微信开放平台 AppID
    client_secret: ""    # AppSecret
    redirect_url: "http://localhost:5173/auth/wechat/callback"
  feishu:
    enabled: false
    client_id: ""        # 飞书 App ID
    client_secret: ""    # App Secret
    redirect_url: "http://localhost:5173/auth/feishu/callback"
  dingtalk:
    enabled: false
    client_id: ""        # 钉钉 AppKey
    client_secret: ""    # AppSecret
    redirect_url: "http://localhost:5173/auth/dingtalk/callback"
  qq:
    enabled: false
    client_id: ""        # QQ 互联 AppID
    client_secret: ""    # AppKey
    redirect_url: "http://localhost:5173/auth/qq/callback"
  # 企业身份提供商：Microsoft Entra ID（Azure AD）
  microsoft:
    enabled: false
    client_id: ""
    client_secret: ""
    tenant: "common"     # 目录(租户) ID，或 "common"/"organizations"
    redirect_url: "http://localhost:5173/auth/microsoft/callback"
  # 通用企业 OIDC：key 即 provider 标识（最终为 "oidc_<key>"），可对接任意标准 OIDC IdP
  oidc:
    # acme:
    #   enabled: true
    #   display_name: "Acme SSO"
    #   client_id: ""
    #   client_secret: ""
    #   redirect_url: "http://localhost:5173/auth/oidc_acme/callback"
    #   auth_url: "https://idp.example.com/oauth2/authorize"
    #   token_url: "https://idp.example.com/oauth2/token"
    #   userinfo_url: "https://idp.example.com/oauth2/userinfo"
    #   scopes: ["openid", "email", "profile"]

# 认证模块通用配置
auth:
  api_token_max_ttl: 2160h   # API Token 最长有效期，默认 2160h（90 天）

# 任务到期提醒定时任务配置（留空/删除即回落默认值）
task_reminder:
  horizon: 24h               # 提醒窗口（提前量）：截止日进入未来此时段内的任务将被提醒，默认 24h
  interval: 30m              # 扫描间隔，默认 30m
  overdue_cooldown: 24h      # 逾期任务重复提醒的最小间隔，默认 24h
  batch_limit: 200           # 单次扫描发送提醒的最大任务数，默认 200

# 数据导出模块配置（留空/删除即回落默认值）
export:
  dir: "./data/exports"      # 导出 CSV 文件存储目录，默认 data/exports
  retention_days: 7          # 文件保留天数，过期由清理任务删除，默认 7
  worker_count: 3            # 异步导出 worker 池大小，默认 3
  batch_size: 1000           # CSV 流式分批写出阈值（行），默认 1000
  max_active_jobs: 10        # 单租户未完结（pending/running）导出任务数上限，达到后新建返回 429，默认 10

# 通用 AI 能力配置（OpenAI 兼容接口，任务模块等作为可选叠加层调用）
# 默认关闭：enabled=false 或未配置 api_key 时，相关 AI 端点返回 503、前端按钮自动禁用，
# 任务等核心业务流程不受任何影响。各字段均可经环境变量覆盖，详见 .env.example。
# 生成密钥：仅支持兼容 OpenAI /chat/completions 协议的端点（含自建网关）。
# ai:
#   enabled: false             # 总开关，默认 false
#   base_url: ""               # OpenAI 兼容端点基址，留空默认 https://api.openai.com/v1
#   api_key: ""                # 访问密钥（建议经 METEORX_AI_API_KEY 注入，勿明文提交）
#   model: ""                  # 默认模型，留空默认 gpt-4o-mini
#   temperature: -1            # 采样温度，负值回落默认 0.2（0 为合法确定性取值）
#   max_tokens: 0             # 单次补全最大 token，<=0 回落默认 512
#   timeout: 20s               # 上游调用超时，<=0 回落默认 20s

# WebSocket 实时推送配置
ws:
  enabled: true
  max_conn_per_user: 10

# 站内消息收件箱配置（留空/删除即回落默认值）
# 收件箱按「人 × 消息」写行，保留期后由定时任务物理删除；负数表示不清理
message:
  retention_days: 90           # 消息保留天数，默认 90；负值关闭清理任务

# 审计日志配置（保留策略 + 防篡改完整性；留空/删除即回落默认，均可经环境变量覆盖，详见 .env.example）
audit:
  # 保留策略：>0 时由定时任务（每小时）物理删除 created_at 早于 N 天前的审计日志；
  # 删除审计历史属敏感操作，默认 0=关闭，需显式开启（清理会记一条 audit/delete/critical 自指审计）。
  retention_days: 0            # ≤0 关闭自动清理（默认）；如 365 表示保留一年
  # 防篡改完整性：每行存 HMAC-SHA256(pepper) 摘要 + 周期锚点链，配套 POST /audit/integrity/verify 校验。
  # pepper 不落库；未启用或未配密钥时整卡降级为关闭，不写摘要、不阻断审计写入。
  # 生成：openssl rand -base64 32
  integrity:
    enabled: false             # 总开关，默认 false
    secret_key: ""             # 行摘要/锚点链 pepper（建议经 METEORX_AUDIT_INTEGRITY_SECRET_KEY 注入，勿明文提交）
    anchor_interval: 1h        # 锚点链生成间隔，默认 1h

# 多渠道消息通知配置
notify:
  webhook:
    enabled: false
    kind: "generic"           # 支持: generic / dingtalk / wechat / feishu
    url: ""                   # Webhook URL（如钉钉机器人、企业微信机器人）
    secret: ""                # 签名密钥（部分渠道需要）
    on_events:                # 触发通知的事件列表
      - "alert"               # 系统告警
      - "announcement"        # 公告发布

# OpenTelemetry 可观测性配置
# 开发环境:  exporter=stdout，直接输出到控制台
# 生产环境:  exporter=otlp，发送到 OTel Collector（需部署 docker-compose）
otel:
  enabled: true
  exporter: "stdout"           # stdout（开发调试） / otlp（生产环境）
  endpoint: "localhost:4317"   # OTLP gRPC 端点（生产环境指向 opentelemetry-collector:4317）
  insecure: true               # 开发环境跳过 TLS，生产需设为 false
  sample_rate: 1.0             # 开发环境 100% 采样；生产建议 0.1（10%）
  service_name: "meteorx"
  service_version: "1.1.0"

# MeiliSearch 全文检索引擎（如不配置，降级为数据库 LIKE 搜索）
search:
  provider: none              # meilisearch / none（留空或 none 时使用数据库 LIKE 搜索）
  # host: "http://127.0.0.1:7700"
  # api_key: "YOUR_MASTER_KEY"
  # index_prefix: "meteorx_"   # 索引前缀（多环境隔离），默认 "meteorx_"