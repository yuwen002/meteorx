version: '3.8'

services:
  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteorx-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Application
      - METEORX_APP_PORT=8081
      - METEORX_APP_MODE=release
      
      # Database
      - METEORX_DB_HOST=mysql
      - METEORX_DB_PORT=3306
      - METEORX_DB_USER=root
      - METEORX_DB_PASSWORD=${DB_PASSWORD:-meteorx_secure_password}
      - METEORX_DB_NAME=meteorx
      - METEORX_DB_TLS=false
      - METEORX_DB_DEBUG=false
      
      # Redis
      - METEORX_REDIS_HOST=redis
      - METEORX_REDIS_PORT=6379
      - METEORX_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - METEORX_REDIS_DB=0
      
      # JWT —— 生产必须显式提供强随机密钥（>=32字节），未配置将拒绝启动
      - METEORX_JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a strong random value (>=32 chars) in production}
      - METEORX_JWT_EXPIRATION=24h
      - METEORX_JWT_ISSUER=meteorx-auth
      
      # Log
      - METEORX_LOG_LEVEL=info
      - METEORX_LOG_FORMAT=json
      
      # OAuth2
      - METEORX_OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - METEORX_OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - METEORX_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - METEORX_OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - METEORX_OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost/auth/google/callback}
      
      # WebSocket
      - METEORX_WS_ENABLED=true
      - METEORX_WS_MAX_CONNECTION=1000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Admin
  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: meteorx-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: meteorx-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-meteorx_secure_password}
      - MYSQL_DATABASE=meteorx
      - MYSQL_USER=meteorx
      - MYSQL_PASSWORD=${DB_PASSWORD:-meteorx_secure_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-meteorx_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: meteorx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # 监控系统 - Prometheus + Grafana
  # ============================================================

  # Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: meteorx-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana 可视化面板
  grafana:
    image: grafana/grafana:11.1.0
    container_name: meteorx-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboard-providers.yml:/etc/grafana/provisioning/dashboards/dashboard-providers.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - meteorx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - 主机系统资源监控
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: meteorx-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - meteorx-network

  # MySQL Exporter - 数据库指标
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: meteorx-mysql-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      - DATA_SOURCE_NAME=root:${DB_PASSWORD:-meteorx_secure_password}@tcp(mysql:3306)/meteorx
    depends_on:
      - mysql
    networks:
      - meteorx-network

  # Redis Exporter - Redis 指标
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: meteorx-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    networks:
      - meteorx-network

  # cAdvisor - Docker 容器指标
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: meteorx-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - meteorx-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  meteorx-network:
    driver: bridge