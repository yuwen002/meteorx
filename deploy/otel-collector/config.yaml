receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # 采样处理器：生产环境可控制 Trace 量
  probabilistic_sampler:
    hash_seed: 42
    sampling_percentage: 100.0

exporters:
  # 调试用：输出到控制台
  debug:
    verbosity: normal

  # 生产用：写入文件或发送到第三方后端
  otlp:
    endpoint: "jaeger:4317"     # Jaeger 接收 OTLP
    tls:
      insecure: true

  # 预留：可以同时输出到 Prometheus（通过 OTel Prometheus Exporter）
  # prometheus:
  #   endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]

    # 预留：指标管道（等需要时开启）
    # metrics:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [debug, prometheus]