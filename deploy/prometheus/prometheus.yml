# MeteorX 监控系统 - Prometheus 配置
# 用于采集应用指标、数据库指标和系统资源指标
global:
  scrape_interval:     15s  # 默认抓取间隔
  evaluation_interval: 15s  # 规则评估间隔
  scrape_timeout:      10s  # 默认抓取超时

# 告警规则
rule_files:
  - "alerts/*.yml"

# 告警配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 抓取目标配置
scrape_configs:
  # === 1. MeteorX 应用指标 ===
  - job_name: 'meteorx'
    honor_labels: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - 'api:8081'  # Docker Compose 内部服务名
        labels:
          service: 'meteorx'
          env: 'production'

  # === 2. Node 系统资源监控 ===
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'node'
          env: 'production'

  # === 3. MySQL 数据库监控 ===
  - job_name: 'mysql'
    static_configs:
      - targets:
          - 'mysql-exporter:9104'
        labels:
          service: 'mysql'
          env: 'production'

  # === 4. Redis 监控 ===
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: 'redis'
          env: 'production'

  # === 5. Docker 容器监控 ===
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'cadvisor:8080'
        labels:
          service: 'docker'
          env: 'production'