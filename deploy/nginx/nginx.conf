# MeteorX Production Nginx Configuration
# 反向代理配置，将前端静态文件 + API 请求分发到后端服务

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 已强制执行（曾以 Report-Only 观察期起步，确认无误报后去掉 -Report-Only 收紧）：
    # 违反策略的资源加载将被浏览器直接拦截；违规仍会 POST 到 /api/v1/csp-report 落服务端日志。
    # style-src 需 'unsafe-inline'：Element Plus/Vue 运行时会注入动态样式；
    # img/connect-src 放开 https: 与 ws/wss:：兼容云存储(OSS/S3/MinIO)预签名直链与 WebSocket 实时推送。
    # 若新页面/新外部资源上线后出现拦截，可查 [csp-violation] 日志定位后再放宽策略，勿直接回退 Report-Only。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; form-action 'self'; report-uri /api/v1/csp-report" always;

    # 去重：Go 的 SecurityHeaders 中间件也会给 API 响应设置 X-Frame-Options /
    # X-Content-Type-Options / Referrer-Policy，而 nginx 反代时又会加上自身(http 层)
    # 的同名头，导致出现两份。此处 hide 上游(Go) 的副本，保证对外响应每头唯一
    #（nginx 为客户端可见响应的唯一来源；直连后端绕过 nginx 时仍由 Go 兜底）。
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # HTTP → HTTPS 重定向（生产环境启用 SSL 时取消注释）
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # HTTPS 服务器
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # SSL 配置（生产环境启用 SSL 时取消注释）
        # listen 443 ssl http2;
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;
        # HSTS 仅在启用 TLS 后有意义（HTTP 下浏览器会忽略），随上面 SSL 一并取消注释。
        # 首次设 max-age 建议先用较小值（如 6h=21600）验证无误，再提升到 1 年 + includeSubDomains + preload。
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 前端静态文件
        root /usr/share/nginx/html;
        index index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 前端路由（SPA）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://api:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;

            # 限制 API 请求频率（可选）
            # limit_req zone=api burst=20 nodelay;
        }

        # WebSocket 代理（实时告警/公告推送）
        location /api/v1/ws {
            proxy_pass http://api:8081/api/v1/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}