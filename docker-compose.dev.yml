version: '3.8'

services:
  # 开发应用服务（带热重载）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meteorx-app-dev
    ports:
      - "8080:8080"
    environment:
      - METEORX_APP_PORT=8080
      - METEORX_APP_MODE=debug
      - METEORX_DB_HOST=db
      - METEORX_DB_PORT=3306
      - METEORX_DB_USER=meteorx
      - METEORX_DB_PASSWORD=meteorx_password
      - METEORX_DB_NAME=meteorx
      - METEORX_REDIS_HOST=redis
      - METEORX_REDIS_PORT=6379
      - METEORX_REDIS_PASSWORD=redis_password
      - METEORX_REDIS_DB=0
      - METEORX_JWT_SECRET=dev-jwt-secret-key-for-local-development-only
      - METEORX_JWT_EXPIRATION=24h
      - METEORX_JWT_ISSUER=meteorx
      
      # OAuth2
      - METEORX_OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - METEORX_OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - METEORX_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - METEORX_OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - METEORX_OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oauth/callback}
      
      # WebSocket
      - METEORX_WS_ENABLED=true
      - METEORX_WS_MAX_CONNECTION=1000

      # OpenTelemetry
      - METEORX_OTEL_ENABLED=true
      - METEORX_OTEL_EXPORTER=stdout
      - METEORX_OTEL_ENDPOINT=otel-collector:4317
      - METEORX_OTEL_INSECURE=true

      # MeiliSearch 全文检索（开发环境默认启用）
      - METEORX_SEARCH_PROVIDER=meilisearch
      - METEORX_SEARCH_HOST=http://meilisearch:7700
      - METEORX_SEARCH_API_KEY=dev-master-key
      - METEORX_SEARCH_INDEX_PREFIX=meteorx_dev_

      # 文件存储后端（默认 local；需本地联调 S3 时取消注释，详见 docs/minio-local-s3.md）
      # - METEORX_FILE_STORAGE_TYPE=s3
      # - METEORX_FILE_CLOUD_ENDPOINT=http://minio:9000
      # - METEORX_FILE_CLOUD_REGION=us-east-1
      # - METEORX_FILE_CLOUD_BUCKET=meteorx
      # - METEORX_FILE_CLOUD_ACCESS_KEY=minioadmin
      # - METEORX_FILE_CLOUD_SECRET_KEY=minioadmin
      # - METEORX_FILE_CLOUD_FORCE_PATH_STYLE=true
    depends_on:
      - db
      - redis
      - meilisearch
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    networks:
      - meteorx-network
    restart: unless-stopped

  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: meteorx-db-dev
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=meteorx
      - MYSQL_USER=meteorx
      - MYSQL_PASSWORD=meteorx_password
    ports:
      - "3306:3306"
    volumes:
      - db-data-dev:/var/lib/mysql
    networks:
      - meteorx-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: meteorx-redis-dev
    command: redis-server --requirepass redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - meteorx-network
    restart: unless-stopped

  # MeiliSearch 全文搜索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: meteorx-meilisearch-dev
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=dev-master-key
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=development
      - MEILI_LOG_LEVEL=INFO
    volumes:
      - meilisearch-data-dev:/meili_data
    networks:
      - meteorx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO：S3 兼容对象存储，用于本地联调文件云存储后端（参见 docs/minio-local-s3.md）
  minio:
    image: minio/minio:latest
    container_name: meteorx-minio-dev
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data-dev:/data
    networks:
      - meteorx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # minio-init：一次性任务，等 MinIO 就绪后自动创建 meteorx 桶（已存在则跳过）
  minio-init:
    image: minio/mc:latest
    container_name: meteorx-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/meteorx &&
      echo 'MinIO bucket meteorx ready'
      "
    networks:
      - meteorx-network

volumes:
  db-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  meilisearch-data-dev:
    driver: local
  minio-data-dev:
    driver: local
  go-mod-cache:
    driver: local

networks:
  meteorx-network:
    driver: bridge