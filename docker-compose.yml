version: '3.8'

services:
  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteorx-app
    ports:
      - "8080:8080"
    environment:
      - METEORX_APP_PORT=8080
      - METEORX_APP_MODE=release
      - METEORX_DB_HOST=db
      - METEORX_DB_PORT=3306
      - METEORX_DB_USER=meteorx
      - METEORX_DB_PASSWORD=${DB_PASSWORD:-meteorx_password}
      - METEORX_DB_NAME=meteorx
      - METEORX_REDIS_HOST=redis
      - METEORX_REDIS_PORT=6379
      - METEORX_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - METEORX_REDIS_DB=0
      - METEORX_JWT_SECRET=${JWT_SECRET}
      - METEORX_JWT_EXPIRATION=24h
      - METEORX_JWT_ISSUER=meteorx
      
      # OAuth2
      - METEORX_OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - METEORX_OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - METEORX_OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - METEORX_OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - METEORX_OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost/api/v1/auth/oauth/callback}
      
      # WebSocket
      - METEORX_WS_ENABLED=true
      - METEORX_WS_MAX_CONNECTION=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
      - app-data:/app/data
    networks:
      - meteorx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: meteorx-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=meteorx
      - MYSQL_USER=meteorx
      - MYSQL_PASSWORD=${DB_PASSWORD:-meteorx_password}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - meteorx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: meteorx-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meteorx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: meteorx-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - meteorx-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local
  app-uploads:
    driver: local
  app-data:
    driver: local

networks:
  meteorx-network:
    driver: bridge